<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transport Speed Calculator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.calculator{background:rgba(255,255,255,.95);border-radius:20px;padding:40px;box-shadow:0 20px 40px rgba(0,0,0,.1);max-width:800px;width:100%}
h1{text-align:center;color:#333;margin-bottom:30px;font-size:2.5rem;font-weight:300}
.row{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.input-group{margin-bottom:25px}
label{display:block;margin-bottom:8px;font-weight:600;color:#555}
input,select{width:100%;padding:15px;border:2px solid #e0e0e0;border-radius:10px;font-size:16px;background:#fff;transition:all .3s}
input:focus,select:focus{border-color:#667eea;outline:none;box-shadow:0 0 0 3px rgba(102,126,234,.1)}
.results{background:#f8f9fa;border-radius:15px;padding:25px;border-left:5px solid #667eea}
.summary{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:20px;border-radius:10px;margin-bottom:20px;font-size:1.1rem;font-weight:500;text-align:center;line-height:1.5}
.result-item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #e0e0e0}
.result-item:last-child{border-bottom:none}
.result-item span:first-child{font-weight:600;color:#555}
.result-item span:last-child{font-family:'SF Mono',Monaco,monospace;color:#333;text-align:right}
@media(max-width:768px){.row{grid-template-columns:1fr}.calculator{padding:20px}h1{font-size:2rem}}
</style>
</head>
<body>
<div class="calculator">
<h1>Transport Speed Calculator</h1>
<div class="input-group"><label for="dataAmount">Data Amount:</label><input type="number" id="dataAmount" value="100" min="0" step="any"></div>
<div class="row">
<div class="input-group"><label for="dataUnit">Data Unit:</label><select id="dataUnit"></select></div>
<div class="input-group"><label for="transport">Transport Method:</label><select id="transport"></select></div>
</div>
<div class="row">
<div class="input-group"><label for="distance">Distance:</label><input type="number" id="distance" value="100" min="0" step="any"></div>
<div class="input-group"><label for="distanceUnit">Distance Unit:</label><select id="distanceUnit"><option value="1">Miles</option><option value="0.621371">Kilometers</option></select></div>
</div>
<div class="results">
<div class="summary" id="summary"></div>
<div class="result-item"><span>Data Amount:</span><span id="amountOut"></span></div>
<div class="result-item"><span>Max Transfer Rate:</span><span id="maxRateOut"></span></div>
<div class="result-item"><span>Latency (RTT):</span><span id="rttOut"></span></div>
<div class="result-item"><span>Latency Added:</span><span id="overheadOut"></span></div>
<div class="result-item"><span>Effective Transfer Rate:</span><span id="rateOut"></span></div>
<div class="result-item"><span>Transfer Time:</span><span id="timeOut"></span></div>
</div>
</div>
<script>
const MiB = 2 ** 20, FIBER = 8.2e-6; // light in fiber/copper ≈ 8.2 µs per mile
const net = { mssBytes: 1460, lossRate: 1e-7, streams: 1 };
const TCP = { latencyPerMile: FIBER, windowMiB: 16, lossy: true };
const FC = { latencyPerMile: FIBER, windowMiB: 500 * 2112 / MiB }; // 500 buffer credits x 2112-byte frames

const dataUnits = [
    { name: "nibbles", mebibytes: 0.5 / MiB },
    { name: "bytes", mebibytes: 1 / MiB },
    { name: "blocks", mebibytes: 512 / MiB },
    { name: "KiB", desc: "Kibibyte (2^10)", mebibytes: 2 ** 10 / MiB },
    { name: "KB", desc: "Kilobyte (10^3)", mebibytes: 1e3 / MiB },
    { name: "MiB", desc: "Mebibyte (2^20)", mebibytes: 1 },
    { name: "MB", desc: "Megabyte (10^6)", mebibytes: 1e6 / MiB },
    { name: "GiB", desc: "Gibibyte (2^30)", mebibytes: 2 ** 10 },
    { name: "GB", desc: "Gigabyte (10^9)", mebibytes: 1e9 / MiB },
    { name: "TiB", desc: "Tebibyte (2^40)", mebibytes: 2 ** 20 },
    { name: "TB", desc: "Terabyte (10^12)", mebibytes: 1e12 / MiB, default: true },
    { name: "PiB", desc: "Pebibyte (2^50)", mebibytes: 2 ** 30 },
    { name: "PB", desc: "Petabyte (10^15)", mebibytes: 1e15 / MiB },
    { name: "EiB", desc: "Exbibyte (2^60)", mebibytes: 2 ** 40 },
    { name: "EB", desc: "Exabyte (10^18)", mebibytes: 1e18 / MiB },
    { name: "Floppy 1.44MB", mebibytes: 1474560 / MiB },
    { name: "CD (650MB)", mebibytes: 650e6 / MiB },
    { name: "DVD Single (4.7GB)", mebibytes: 4.7e9 / MiB },
    { name: "DVD Dual (8.5GB)", mebibytes: 8.5e9 / MiB },
    { name: "Blu-ray Single (25GB)", mebibytes: 25e9 / MiB },
    { name: "Blu-ray Dual (50GB)", mebibytes: 50e9 / MiB },
    { name: "Punch Card", mebibytes: 80 / MiB },
    { name: "Apollo Flight Computer", mebibytes: 76 * 1024 / MiB }
];

const transports = [
    { name: "10 Megabit Ethernet", mebibytesPerSecond: 10e6 / 8 / MiB, ...TCP },
    { name: "100 Megabit Ethernet", mebibytesPerSecond: 100e6 / 8 / MiB, ...TCP },
    { name: "1 Gigabit Ethernet", mebibytesPerSecond: 1e9 / 8 / MiB, ...TCP },
    { name: "10 Gigabit Ethernet", mebibytesPerSecond: 10e9 / 8 / MiB, ...TCP, default: true },
    { name: "25 Gigabit Ethernet", mebibytesPerSecond: 25e9 / 8 / MiB, ...TCP },
    { name: "40 Gigabit Ethernet", mebibytesPerSecond: 40e9 / 8 / MiB, ...TCP },
    { name: "100 Gigabit Ethernet", mebibytesPerSecond: 100e9 / 8 / MiB, ...TCP },
    { name: "200 Gigabit Ethernet", mebibytesPerSecond: 200e9 / 8 / MiB, ...TCP },
    { name: "400 Gigabit Ethernet", mebibytesPerSecond: 400e9 / 8 / MiB, ...TCP },
    { name: "1G Fibre Channel", mebibytesPerSecond: 100e6 / MiB, ...FC },
    { name: "2G Fibre Channel", mebibytesPerSecond: 200e6 / MiB, ...FC },
    { name: "4G Fibre Channel", mebibytesPerSecond: 400e6 / MiB, ...FC },
    { name: "8G Fibre Channel", mebibytesPerSecond: 800e6 / MiB, ...FC },
    { name: "16G Fibre Channel", mebibytesPerSecond: 1600e6 / MiB, ...FC },
    { name: "32G Fibre Channel", mebibytesPerSecond: 3200e6 / MiB, ...FC },
    { name: "64G Fibre Channel", mebibytesPerSecond: 6400e6 / MiB, ...FC },
    { name: "IBM 9-Track Tape", mebibytesPerSecond: 15625 / MiB, latencyPerMile: 0 },
    { name: "IBM 1440 Punch Card Reader", mebibytesPerSecond: 3125 / MiB, latencyPerMile: 0 },
    { name: "Marconi Telegraph", mebibytesPerSecond: 2.083 / MiB, latencyPerMile: FIBER },
    { name: "Pony Express (10 mph avg)", mebibytesPerSecond: 0.00000000000055, latencyPerMile: 360 }
];

const $ = id => document.getElementById(id);
const fill = (sel, list, text) => list.forEach(x => sel.add(new Option(text(x), '', x.default, x.default)));
const fmtNum = (n, d = 6) => n.toLocaleString(undefined, { maximumFractionDigits: d });
const fmtRate = m => {
    const [v, u] = m >= 1024 ? [m / 1024, 'GiB/s'] : m >= 1 ? [m, 'MiB/s'] : m * 1024 >= 1 ? [m * 1024, 'KiB/s'] : [m * MiB, 'B/s'];
    return (v < 0.01 ? v.toPrecision(3) : fmtNum(v, 2)) + ' ' + u;
};
const timeUnits = [['year', 31536000], ['day', 86400], ['hour', 3600], ['minute', 60], ['second', 1]];
const fmtTime = s => {
    if (s < 1) return s < 0.001 ? `${Math.round(s * 1e6)} microseconds` : `${Math.round(s * 1000)} milliseconds`;
    let r = Math.round(s);
    const i = timeUnits.findIndex(([, v]) => r >= v);
    return timeUnits.slice(i, i + 3).map(([n, v]) => { const q = Math.floor(r / v); r %= v; return q ? `${fmtNum(q)} ${n}${q > 1 ? 's' : ''}` : ''; }).filter(Boolean).join(', ');
};

let mib = 0;
fill($('dataUnit'), dataUnits, u => u.desc ? `${u.name} – ${u.desc}` : u.name);
fill($('transport'), transports, t => t.name);

function calculate() {
    const amt = parseFloat($('dataAmount').value), u = dataUnits[$('dataUnit').selectedIndex], t = transports[$('transport').selectedIndex];
    const dist = parseFloat($('distance').value) || 0, rtt = 2 * dist * $('distanceUnit').value * t.latencyPerMile;
    if (!(amt > 0)) return;
    mib = amt * u.mebibytes;
    let rate = t.mebibytesPerSecond, overhead = rtt / 2;
    if (rtt) {
        if (t.windowMiB) rate = Math.min(rate, net.streams * t.windowMiB / rtt);
        if (t.lossy) {
            // Mathis: loss-limited TCP throughput falls with RTT; slow start costs a few RTTs
            rate = Math.min(rate, net.streams * net.mssBytes * 1.22 / (rtt * Math.sqrt(net.lossRate)) / MiB);
            overhead += rtt * (1 + Math.ceil(Math.log2(Math.max(1, rate * MiB * rtt / (10 * net.mssBytes)))));
        }
    }
    const time = mib / rate + overhead;
    const distText = dist ? ` over ${fmtNum(dist)} ${$('distanceUnit').selectedOptions[0].text.toLowerCase()}` : '';
    $('summary').textContent = `For ${fmtNum(amt)} ${u.name}${distText}, it will take ${fmtTime(time)} using ${t.name}.`;
    $('amountOut').textContent = `${fmtNum(amt)} ${u.name}`;
    $('maxRateOut').textContent = fmtRate(t.mebibytesPerSecond);
    $('rttOut').textContent = fmtTime(rtt);
    $('overheadOut').textContent = fmtTime(overhead);
    $('rateOut').textContent = `${fmtRate(rate)} (${fmtNum(rate / t.mebibytesPerSecond * 100, 1)}% of max)`;
    $('timeOut').textContent = fmtTime(time);
}

$('dataUnit').addEventListener('change', () => { $('dataAmount').value = +(mib / dataUnits[$('dataUnit').selectedIndex].mebibytes).toPrecision(6); calculate(); });
['dataAmount', 'distance'].forEach(id => $(id).addEventListener('input', calculate));
['transport', 'distanceUnit'].forEach(id => $(id).addEventListener('change', calculate));
calculate();
</script>
</body>
</html>
